name: CI — SIA RAG Microservice

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: Week_5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest

      - name: Lint with flake8
        working-directory: Week_5
        run: |
          # Stop on syntax errors (E9xx) or undefined names (F8xx); warn on style
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        working-directory: Week_5
        run: black --check --line-length=120 app/

      - name: Run pytest suite (Week 3 tests)
        working-directory: Week_3
        run: |
          pip install -r ../Week_5/requirements.txt
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f Week_8/Dockerfile -t sia-api:ci-test ./Week_5

      - name: Smoke test — container starts and /health responds
        run: |
          docker run -d --name sia_smoke -p 8000:8000 sia-api:ci-test
          sleep 8
          curl --fail http://localhost:8000/ || (docker logs sia_smoke && exit 1)
          docker stop sia_smoke && docker rm sia_smoke
